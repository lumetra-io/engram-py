[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumetra-engram"
version = "0.2.1"
description = "Official Python client for Engram — durable, explainable memory for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Lumetra", email = "hi@lumetra.io" }]
keywords = ["engram", "lumetra", "memory", "ai", "agents", "llm", "mcp", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://lumetra.io"
Documentation = "https://lumetra.io/docs"
Repository = "https://github.com/lumetra-io/engram-py"
Issues = "https://github.com/lumetra-io/engram-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lumetra_engram"]

[tool.hatch.build.targets.sdist]
include = [
  "src/lumetra_engram",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
